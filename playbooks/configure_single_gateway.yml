---
- name: "Configure AAP Gateway Node: {{ current_aap.name }}"
  block:
    - name: Set Gateway Endpoint Facts
      ansible.builtin.set_fact:
        aap_hostname: "{{ current_aap.host }}"
        aap_username: "{{ current_aap.username }}"
        aap_password: "{{ current_aap.password }}"
        aap_validate_certs: "{{ current_aap.validate_certs }}"

    - name: Dispatch Configurations via infra.aap_configuration
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        controller_hostname: "{{ aap_hostname }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        controller_validate_certs: "{{ aap_validate_certs }}"
