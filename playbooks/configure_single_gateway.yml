---
- name: "Configure AAP Platform Node: {{ current_aap.name }}"
  block:
    - name: Apply AAP Platform Infrastructure Configurations
      ansible.builtin.include_role:
        name: ansible.platform.dispatch
      vars:
        # Enforce native Red Hat collection dispatching
        aap_configuration_use_awx_collection: false
        infra_aap_configuration_use_awx_collection: false

        # Dispatcher role matrix targeting ansible.platform sub-roles
        aap_configuration_dispatcher_roles:
          - role: controller_organizations
            var: controller_organizations
            tags: organizations
          - role: controller_credentials
            var: controller_credentials
            tags: credentials
          - role: controller_projects
            var: controller_projects
            tags: projects
          - role: controller_inventories
            var: controller_inventories
            tags: inventories
          - role: controller_job_templates
            var: controller_templates
            tags: job_templates

        controller_configuration_dispatcher_roles: "{{ aap_configuration_dispatcher_roles }}"

        # Gateway Connection Parameters
        controller_hostname: "{{ current_aap.host }}"
        controller_username: "{{ current_aap.username }}"
        controller_password: "{{ current_aap.password }}"
        controller_validate_certs: "{{ current_aap.validate_certs }}"