---
- name: "Configure AAP Platform Node: {{ current_aap.name }}"
  vars:
    controller_hostname: "{{ current_aap.host }}"
    controller_username: "{{ current_aap.username }}"
    controller_password: "{{ current_aap.password }}"
    controller_validate_certs: "{{ current_aap.validate_certs }}"

    aap_configuration_use_awx_collection: false
    infra_aap_configuration_use_awx_collection: false

    # Force zero delay to eliminate async tracking
    controller_configuration_async_timeout: 0
    aap_configuration_async_timeout: 0
    controller_configuration_async_delay: 0
    aap_configuration_async_delay: 0

  block:
    - name: Configure Controller Organizations
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_organizations
      when: controller_organizations is defined

    - name: Configure Controller Credentials (Native Direct)
      ansible.controller.credential:
        name: "{{ item.name }}"
        description: "{{ item.description | default(omit) }}"
        credential_type: "{{ item.credential_type }}"
        organization: "{{ item.organization }}"
        inputs: "{{ item.inputs }}"
        state: present
        controller_host: "{{ current_aap.host }}"
        controller_username: "{{ current_aap.username }}"
        controller_password: "{{ current_aap.password }}"
        validate_certs: "{{ current_aap.validate_certs }}"
      loop: "{{ controller_credentials }}"
      when: controller_credentials is defined
      no_log: false  # Explicitly unhide payload output for debugging

    - name: Configure Controller Projects
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_projects
      when: controller_projects is defined

    - name: Configure Controller Inventories
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_inventories
      when: controller_inventories is defined

    - name: Configure Controller Hosts
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_hosts
      when: controller_hosts is defined

    - name: Configure Controller Job Templates
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_job_templates
      when: controller_templates is defined