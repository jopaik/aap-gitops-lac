---
- name: Round-Robin Job Dispatch Across AAP Clusters
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../vars/aap_config.yml"
    - "../vars/vault.yml"

  tasks:
    - name: Select Target AAP Platform Node
      ansible.builtin.set_fact:
        run_id: "{{ lookup('env', 'GITHUB_RUN_NUMBER') | default(now(fmt='%S'), true) | int }}"
        
    - name: Calculate Round-Robin Cluster Target
      ansible.builtin.set_fact:
        selected_aap: "{{ aap_instances[run_id | int % (aap_instances | length)] }}"

    - name: Display Selected Gateway Node
      ansible.builtin.debug:
        msg: "Dispatching job run #{{ run_id }} to: {{ selected_aap.name }} ({{ selected_aap.host }})"

    - name: Launch Workload Job Template
      ansible.controller.job_launch:
        job_template: "Deploy Workload Job 2"
        controller_host: "{{ selected_aap.host }}"
        controller_username: "{{ selected_aap.username }}"
        controller_password: "{{ selected_aap.password }}"
        validate_certs: "{{ selected_aap.validate_certs }}"
        wait: true
      register: job_result

    - name: Output Job Launch Result
      ansible.builtin.debug:
        var: job_result