---
aap_configuration_use_awx_collection: false
infra_aap_configuration_use_awx_collection: false
controller_configuration_use_awx_collection: false

aap_instances:
  - name: "AAP-Platform-DC1"
    host: "{{ vault_aap_gateway_dc1_url }}"
    username: "admin"
    password: "{{ vault_aap_gateway_dc1_password }}"
    validate_certs: false
    labels:
      - "dc1"
      - "production"
  - name: "AAP-Platform-DC2"
    host: "{{ vault_aap_gateway_dc2_url }}"
    username: "admin"
    password: "{{ vault_aap_gateway_dc2_password }}"
    validate_certs: false
    labels:
      - "dc2"
      - "non-production"

controller_organizations:
  - name: "Default"
    description: "Primary Enterprise Organization"

controller_credentials:
  - name: "Production SSH Credential"
    description: "Machine Password Credential"
    credential_type: "Machine"
    organization: "Default"
    inputs:
      username: "ansible"
      password: "{{ machine_password }}"

controller_projects:
  - name: "GitOps Application Configs"
    description: "Managed via GitOps IaC Pipeline"
    scm_type: "git"
    scm_url: "https://github.com/jopaik/aap-gitops-lac.git"
    scm_branch: "main"
    scm_update_on_launch: false
    organization: "Default"
    wait: true

controller_inventories:
  - name: "Multi-DC Production Inventory"
    description: "Production Inventory spanning DC1 and DC2"
    organization: "Default"
    groups:
      - name: "dc1"
        targets:
          - "dc1_host_1"
          - "dc1_host_2"
      - name: "dc2"
        targets:
          - "dc2_host_3"
          - "dc2_host_4"
      - name: "production"
        targets:
          - "dc1_host_1"
          - "dc1_host_2"
      - name: "non-production"
        targets:
          - "dc2_host_3"
          - "dc2_host_4"

controller_hosts:
  - name: "dc1_host_1"
    inventory: "Multi-DC Production Inventory"
    variables:
      ansible_host: "localhost"
  - name: "dc1_host_2"
    inventory: "Multi-DC Production Inventory"
    variables:
      ansible_host: "localhost"
  - name: "dc2_host_3"
    inventory: "Multi-DC Production Inventory"
    variables:
      ansible_host: "localhost"
  - name: "dc2_host_4"
    inventory: "Multi-DC Production Inventory"
    variables:
      ansible_host: "localhost"

controller_templates:
  - name: "Deploy Workload Job"
    project: "GitOps Application Configs"
    playbook: "playbooks/demorun.yml"
    inventory: "Multi-DC Production Inventory"
    job_type: "run"
    limit: "dc1"                  # Default limit configured on the template
    ask_limit_on_launch: true    # Allows API/job_launch overrides at runtime
  - name: "Deploy Workload Job 2"
    project: "GitOps Application Configs"
    playbook: "playbooks/demorun.yml"
    inventory: "Multi-DC Production Inventory"
    job_type: "run"
    limit: "dc1"                  # Default limit configured on the template
    ask_limit_on_launch: true    # Allows API/job_launch overrides at runtime
  - name: "Deploy Workload Job 3"
    project: "GitOps Application Configs"
    playbook: "playbooks/demorun.yml"
    inventory: "Multi-DC Production Inventory"
    job_type: "run"
    limit: "dc1"                  # Default limit configured on the template
    ask_limit_on_launch: true    # Allows API/job_launch overrides at runtime