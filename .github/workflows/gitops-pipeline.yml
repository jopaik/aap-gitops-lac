name: AAP 2.6 GitOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gitops-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Vault Password File
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass
      - name: Install Ansible & Collections
        run: |
          pip install ansible-core
          
          # Extract vaulted token value
          HUB_TOKEN=$(ansible-vault view vars/vault.yml --vault-password-file .vault_pass | grep vault_automation_hub_token | awk '{print $2}')
          
          # Pass token directly to ansible-galaxy CLI
          ansible-galaxy collection install ansible.platform --server https://console.redhat.com/api/automation-hub/content/published/ --token "$HUB_TOKEN"
          ansible-galaxy collection install -r collections/requirements.yml --force



      - name: Apply AAP Infrastructure Configurations
        run: |
          ansible-playbook playbooks/configure_aap.yml --vault-password-file .vault_pass

      - name: Round-Robin Job Dispatch
        run: |
          ansible-playbook playbooks/dispatch_round_robin.yml --vault-password-file .vault_pass

      - name: Clean up Vault Password File
        if: always()
        run: rm -f .vault_pass