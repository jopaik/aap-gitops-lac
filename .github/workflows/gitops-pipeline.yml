name: AAP 2.6 GitOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gitops-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ansible & Collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install awx.awx --force
          ansible-galaxy collection install -r collections/requirements.yml --force

      - name: Create Vault Password File
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Apply AAP Infrastructure Configurations
        run: |
          ansible-playbook playbooks/configure_aap.yml --vault-password-file .vault_pass

      - name: Round-Robin Job Dispatch
        run: |
          ansible-playbook playbooks/dispatch_round_robin.yml --vault-password-file .vault_pass

      - name: Clean up Vault Password File
        if: always()
        run: rm -f .vault_pass