name: AAP 2.6 GitOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gitops-execution:
    runs-on: ubuntu-latest
    container:
      image: quay.io/jopaik/aap-runner:jp
      credentials:
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create Vault Password File
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Verify or Load Ansible Collections in GitOps Engine
        run: |
                echo "Checking installed collections inside container..."
                ansible-galaxy collection list
                
                # Install from requirements.yml if any collection is missing
                if [ -f "collections/requirements.yml" ]; then
                  echo "Ensuring collections from requirements.yml are present..."
                  ansible-galaxy collection install -r collections/requirements.yml --force-with-deps
                fi

      - name: Apply AAP Infrastructure Configurations
        run: |
          ansible-playbook playbooks/configure_aap.yml --vault-password-file .vault_pass

      - name: Round-Robin Job Dispatch
        run: |
          ansible-playbook playbooks/dispatch_round_robin.yml --vault-password-file .vault_pass

      - name: Clean up Vault Password File
        if: always()
        run: rm -f .vault_pass